<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Without this the mobile browser uses a 980px layout viewport and zooms
         out: the canvas is laid out at 980x2120 while winit reports pointer
         coordinates in visual-viewport CSS pixels, so every tap lands ~2.5x
         away from its target. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>EPlatform</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        background: #1c1e22;
      }
      canvas {
        display: block;
        outline: none;
        /* Touch devices: the canvas owns all gestures, so the browser must not
           scroll/zoom/double-tap-zoom instead of delivering pointer events. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      // Capture wasm panics/errors for automated inspection.
      window.__epErrors = [];
      window.addEventListener("error", (e) =>
        window.__epErrors.push(String(e.message) + " @ " + (e.filename || "") + ":" + (e.lineno || "")),
      );
      window.addEventListener("unhandledrejection", (e) =>
        window.__epErrors.push("rejection: " + String(e.reason)),
      );
    </script>
    <script>
      // Mobile text input bridge.
      //
      // iOS/Android only raise the soft keyboard for a focused form field,
      // not for a canvas. The canvas (winit) keeps rendering and hit-testing;
      // this off-screen textarea owns text composition and forwards one
      // semantic action at a time to Rust (`window.__epTextInput`).
      (function () {
        var ta = document.createElement("textarea");
        ta.id = "ep-text-input";
        ta.setAttribute("autocomplete", "off");
        ta.setAttribute("autocapitalize", "off");
        ta.setAttribute("autocorrect", "off");
        ta.setAttribute("spellcheck", "false");
        ta.setAttribute("inputmode", "text");
        ta.setAttribute("enterkeyhint", "done");
        ta.setAttribute("aria-hidden", "true");
        ta.tabIndex = -1;
        // Keep it rendered (iOS ignores `display:none` for programmatic
        // focus), but make it invisible and unable to affect layout.
        ta.style.cssText = [
          "position:fixed",
          "left:0",
          "top:0",
          "width:1px",
          "height:1px",
          // iOS can refuse to focus a fully transparent/zero-size field;
          // 1px at 1% opacity is rendered but visually invisible.
          "opacity:0.01",
          "border:0",
          "padding:0",
          "margin:0",
          "z-index:1000",
          "font-size:16px",
          "caret-color:transparent",
          "background:transparent",
          "color:transparent",
          "pointer-events:none",
          "resize:none",
          "overflow:hidden",
          "white-space:pre",
        ].join(";");
        document.body.appendChild(ta);

        var queue = (window.__epTextQueue = []);
        var active = false;
        var composing = false;
        var suppressNextInput = false;
        var inputRect = { x: 0, y: 0, w: 1, h: 1 };
        // On phones the transparent textarea becomes a real hit target over
        // the focused QLineEdit while the keyboard is closed. Tapping it is a
        // native input tap, so iOS reopens the keyboard every time.
        var overlayEnabled =
          window.matchMedia("(pointer: coarse)").matches ||
          (navigator.maxTouchPoints || 0) > 1;

        function applyRect() {
          if (!active) return;
          ta.style.left = inputRect.x + "px";
          ta.style.top = inputRect.y + "px";
          ta.style.width = Math.max(1, inputRect.w) + "px";
          ta.style.height = Math.max(1, inputRect.h) + "px";
        }

        function updatePointerEvents() {
          // On touch devices the input itself must receive every tap over the
          // focused line edit. This is the only reliable way to ask iOS for
          // the keyboard again after it was dismissed.
          ta.style.pointerEvents = active && overlayEnabled ? "auto" : "none";
        }

        window.__epSetTextInputRect = function (x, y, w, h) {
          inputRect = { x: x, y: y, w: w, h: h };
          applyRect();
          updatePointerEvents();
        };

        function send(kind, text) {
          if (typeof window.__epTextInput === "function") {
            try {
              window.__epTextInput(kind, text || "");
              return;
            } catch (_) {}
          }
          queue.push([kind, text || ""]);
        }

        window.__epFlushTextQueue = function () {
          var callback = window.__epTextInput;
          if (typeof callback !== "function") return;
          while (queue.length > 0) {
            var event = queue.shift();
            callback(event[0], event[1]);
          }
        };

        function resetViewportScroll() {
          if (window.scrollX !== 0 || window.scrollY !== 0) {
            window.scrollTo(0, 0);
          }
          if (document.documentElement.scrollTop !== 0) {
            document.documentElement.scrollTop = 0;
          }
          if (document.body.scrollTop !== 0) {
            document.body.scrollTop = 0;
          }
        }

        function focusTextInput() {
          try {
            ta.focus({ preventScroll: true });
          } catch (_) {}
          resetViewportScroll();
          setTimeout(resetViewportScroll, 50);
          setTimeout(resetViewportScroll, 250);
        }

        window.__epSetTextInputActive = function (next) {
          next = !!next;
          if (next === active) {
            applyRect();
            updatePointerEvents();
            return;
          }
          active = next;
          if (active) {
            ta.value = "";
            applyRect();
            updatePointerEvents();
            focusTextInput();
          } else {
            ta.blur();
            ta.value = "";
            composing = false;
            suppressNextInput = false;
            ta.style.left = "0";
            ta.style.top = "0";
            ta.style.width = "1px";
            ta.style.height = "1px";
            ta.style.pointerEvents = "none";
          }
        };

        ta.addEventListener("focus", function () {
          updatePointerEvents();
          resetViewportScroll();
          setTimeout(resetViewportScroll, 50);
          setTimeout(resetViewportScroll, 250);
        });
        ta.addEventListener("blur", updatePointerEvents);
        window.addEventListener("scroll", resetViewportScroll, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("scroll", resetViewportScroll);
          window.visualViewport.addEventListener("resize", resetViewportScroll);
        }

        ta.addEventListener("compositionstart", function () {
          composing = true;
          suppressNextInput = false;
        });

        ta.addEventListener("compositionend", function (event) {
          composing = false;
          var text = event.data || ta.value || "";
          ta.value = "";
          // Some engines fire one more `input` with the same text after
          // `compositionend`; suppress it to avoid a duplicate insert.
          suppressNextInput = true;
          if (text) send("insert", text);
        });

        ta.addEventListener("input", function (event) {
          if (composing || event.isComposing) return;
          if (suppressNextInput) {
            suppressNextInput = false;
            ta.value = "";
            return;
          }
          var text = ta.value;
          ta.value = "";
          if (text) send("insert", text);
        });

        // Registered before the wasm/winit bundle, in capture phase: while
        // the hidden field owns the keyboard, winit must not also receive
        // `keydown` (otherwise every printable key is inserted twice).
        window.addEventListener(
          "keydown",
          function (event) {
            if (!active) return;
            event.stopImmediatePropagation();
            if (event.isComposing || composing || event.key === "Process") return;

            var shift = event.shiftKey ? "1" : "";
            if (event.ctrlKey || event.metaKey) {
              if (event.key === "a" || event.key === "A") {
                event.preventDefault();
                send("selectAll", "");
              }
              return;
            }

            switch (event.key) {
              case "Backspace":
                event.preventDefault();
                send("backspace", "");
                break;
              case "Delete":
                event.preventDefault();
                send("delete", "");
                break;
              case "Enter":
                event.preventDefault();
                send("commit", "");
                break;
              case "Tab":
                event.preventDefault();
                send("tab", shift);
                break;
              case "Escape":
                event.preventDefault();
                send("clearFocus", "");
                break;
              case "ArrowLeft":
                event.preventDefault();
                send("left", shift);
                break;
              case "ArrowRight":
                event.preventDefault();
                send("right", shift);
                break;
              case "Home":
                event.preventDefault();
                send("home", shift);
                break;
              case "End":
                event.preventDefault();
                send("end", shift);
                break;
              case "ArrowUp":
                event.preventDefault();
                send("up", "");
                break;
              case "ArrowDown":
                event.preventDefault();
                send("down", "");
                break;
              case "PageUp":
                event.preventDefault();
                send("pageUp", "");
                break;
              case "PageDown":
                event.preventDefault();
                send("pageDown", "");
                break;
              default:
                // Printable characters go through `input`/IME composition.
                break;
            }
          },
          true,
        );
      })();
    </script>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
  </body>
</html>
