<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Without this the mobile browser uses a 980px layout viewport and zooms
         out: the canvas is laid out at 980x2120 while winit reports pointer
         coordinates in visual-viewport CSS pixels, so every tap lands ~2.5x
         away from its target. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>EPlatform</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1c1e22;
      }
      canvas {
        display: block;
        outline: none;
        /* Touch devices: the canvas owns all gestures, so the browser must not
           scroll/zoom/double-tap-zoom instead of delivering pointer events. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      // Capture wasm panics/errors for automated inspection.
      window.__epErrors = [];
      window.addEventListener("error", (e) =>
        window.__epErrors.push(String(e.message) + " @ " + (e.filename || "") + ":" + (e.lineno || "")),
      );
      window.addEventListener("unhandledrejection", (e) =>
        window.__epErrors.push("rejection: " + String(e.reason)),
      );
    </script>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
  </body>
</html>
