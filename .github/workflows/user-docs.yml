name: User docs

on:
  push:
    branches: [main]
    paths:
      - "docs/user/**"
      - "scripts/gen_user_docs.py"
      - "scripts/sync_wiki.sh"
      - "client/crates/rqt/src/widgets.rs"
      - "client/crates/rqt/src/gui.rs"
      - "client/crates/rqt/src/render/primitive.rs"
      - "client/crates/app/src/shell.rs"
      - "server/priv/lua_modules/form.lua"
      - "server/priv/lua_modules/application.lua"
      - "server/lib/e_platform/lua/api.ex"
      - "server/priv/qt_forms/**"
      - ".github/workflows/user-docs.yml"
  pull_request:
    paths:
      - "docs/user/**"
      - "scripts/gen_user_docs.py"
      - "client/crates/rqt/src/widgets.rs"
      - "client/crates/rqt/src/gui.rs"
      - "client/crates/rqt/src/render/primitive.rs"
      - "client/crates/app/src/shell.rs"
      - "server/priv/lua_modules/form.lua"
      - "server/priv/lua_modules/application.lua"
      - "server/lib/e_platform/lua/api.ex"
      - "server/priv/qt_forms/**"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Check generated docs are fresh
        run: python3 scripts/gen_user_docs.py --check

  sync-wiki:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Regenerate + publish Wiki
        env:
          WIKI_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          ./scripts/sync_wiki.sh
