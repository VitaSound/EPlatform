map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hermes sets X-Forwarded-Proto=https; local compose has no header → ws.
map $http_x_forwarded_proto $ws_scheme {
    default ws;
    https   wss;
}

server {
    listen 80;
    server_name _;

    # Keep Location relative so browsers stay on https:// via hermes.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Phoenix health (and any other API) through the app container.
    location = /health {
        proxy_pass http://phoenix:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Phoenix Channels WebSocket (same-origin for browser wss/ws).
    location /socket {
        proxy_pass http://phoenix:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Bare / → gallery landing with same-origin backend.
    location = / {
        if ($args = "") {
            return 302 /?main=gallery.lua&mainui=&backend=$ws_scheme://$host/socket/websocket&maxdim=2048&texthd=1;
        }
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        if ($args = "") {
            return 302 /?main=gallery.lua&mainui=&backend=$ws_scheme://$host/socket/websocket&maxdim=2048&texthd=1;
        }
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }

    # Trunk content-hashed assets: long cache + gzip.
    location ~* \.(?:js|wasm|css|mjs)$ {
        gzip on;
        gzip_types application/javascript application/wasm text/css application/json;
        gzip_min_length 1024;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        gzip on;
        gzip_types text/html application/javascript application/wasm text/css application/json;
        try_files $uri $uri/ /index.html;
    }
}
